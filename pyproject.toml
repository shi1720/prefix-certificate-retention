[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prefix-retention"
version = "0.1.0"
description = "Exact prefix-certificate TTL optimization and independently checked cache replay"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.12", "matplotlib>=3.8", "pandas>=2.1", "PyMaxflow>=1.3"]

[project.optional-dependencies]
test = ["pytest>=8", "networkx>=3"]
artifacts = ["reportlab>=4", "pypdf>=6", "pillow>=11"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
