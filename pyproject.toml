[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prefix-retention"
version = "0.1.0"
description = "Exact optimization and trace replay for prefix-coherent KV cache retention"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.12", "matplotlib>=3.8", "pandas>=2.1"]

[project.optional-dependencies]
test = ["pytest>=8", "networkx>=3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
